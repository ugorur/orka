name: test
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: runner.os == 'macOS'
        run: brew install coreutils jq
      - run: git config --global init.defaultBranch main
      - run: bash tests/smoke.sh
      - if: runner.os == 'macOS'
        name: smoke with the stock bash 3.2
        run: PATH="/bin:$PATH" bash -c 'bash --version | head -1 && bash tests/smoke.sh'
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: shellcheck -S warning skills/orka/scripts/*.sh skills/orka/scripts/orka skills/orka/scripts/workers/*.sh install.sh tests/*.sh tests/workers/*.sh
